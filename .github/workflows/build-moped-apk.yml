name: Build Moped Navigator APK
on:
  push:
    branches:
      - moped-navigator-apk-build
    paths:
      - 'moped-app/**'
      - '.github/workflows/build-moped-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK and licenses
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: moped-app
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate package
        run: |
          test -s moped-app/app/build/outputs/apk/debug/app-debug.apk
          ls -lh moped-app/app/build/outputs/apk/debug/app-debug.apk
          sha256sum moped-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: moped-put-android-apk
          path: moped-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
