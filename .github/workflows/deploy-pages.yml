name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/smena-film-hq-aswtd3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -- --base=/smena/
        env:
          # Публичные значения (anon/publishable ключ), не секреты — их и так
          # видно в собранном клиентском бандле любого фронтенда на Supabase.
          VITE_SUPABASE_URL: https://qednreltwoankundfkpa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_lWNQO_tg_rct0t16I6iExw_oPprcdKk
      # SPA-фолбэк: GitHub Pages отдаёт 404.html на прямой переход по
      # клиентскому маршруту (например /p/xxx/today) — подсовываем ему
      # index.html, чтобы React Router сам подхватил путь.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
